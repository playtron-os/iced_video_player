[package]
name = "iced_video_player"
description = "A convenient video player widget for Iced"
homepage = "https://github.com/jazzfool/iced_video_player"
repository = "https://github.com/jazzfool/iced_video_player"
readme = "README.md"
keywords = ["gui", "iced", "video"]
categories = ["gui", "multimedia"]
version = "0.6.0"
authors = ["jazzfool"]
edition = "2021"
resolver = "2"
license = "MIT OR Apache-2.0"
exclude = [
    ".media/test.mp4"
]

[dependencies]
gstreamer = "0.23"
gstreamer-app = "0.23" # appsink
gstreamer-base = "0.23" # basesrc
gstreamer-pbutils = "0.23"
glib = "0.20" # gobject traits and error type
log = "0.4"
thiserror = "1"
url = "2" # media uri
html-escape = "0.2.13"

# Pinned to the same branch cosmic-player and cosmic-edit use. Consumers patch
# `https://github.com/pop-os/libcosmic` -> playtron-os, but that patch table does
# NOT cover this dependency, which names playtron-os directly. Left unbranched it
# resolves to `master`, which is a second libcosmic source id in the consumer's
# graph: resolution then fails (master needs zbus ^5.15 against ashpd's 5.14), and
# even if it resolved, this crate's `Widget` impl would come from a different
# libcosmic than the `Element` it is passed into.
#
# `fix/theme-seed-7c4bf15` is upstream 7c4bf15 -- the base this crate already
# built against -- plus the theme fixes, so it is API-identical here.
[dependencies.libcosmic]
git = "https://github.com/playtron-os/libcosmic.git"
branch = "fix/theme-seed-7c4bf15"
default-features = false
features = ["tokio", "winit"]

[dev-dependencies]
env_logger = "0.11"

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]

[package.metadata.nix]
systems = ["x86_64-linux"]
app = true
build = true
runtimeLibs = [
    "vulkan-loader",
    "wayland",
    "wayland-protocols",
    "libxkbcommon",
    "xorg.libX11",
    "xorg.libXrandr",
    "xorg.libXi", "gst_all_1.gstreamer", "gst_all_1.gstreamermm", "gst_all_1.gst-plugins-bad", "gst_all_1.gst-plugins-ugly", "gst_all_1.gst-plugins-good", "gst_all_1.gst-plugins-base",
]
buildInputs = ["libxkbcommon", "gst_all_1.gstreamer", "gst_all_1.gstreamermm", "gst_all_1.gst-plugins-bad", "gst_all_1.gst-plugins-ugly", "gst_all_1.gst-plugins-good", "gst_all_1.gst-plugins-base"]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["wasm32-unknown-unknown"]
