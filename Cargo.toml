[package]
name = "iced_video_player"
description = "A convenient video player widget for Iced"
homepage = "https://github.com/jazzfool/iced_video_player"
repository = "https://github.com/jazzfool/iced_video_player"
readme = "README.md"
keywords = ["gui", "iced", "video"]
categories = ["gui", "multimedia"]
version = "0.6.0"
authors = ["jazzfool"]
edition = "2024"
resolver = "2"
license = "MIT OR Apache-2.0"
exclude = [
    ".media/test.mp4"
]

[dependencies]
# iced's default features, MINUS `crisp`, plus the three this crate needs.
#
# `crisp` snaps every primitive to the pixel grid. A consumer that turns it
# off — icetron does, deliberately: it jitters on some monitors — gets it
# back the moment this crate joins the build, because cargo unifies features
# across the graph and this dependency took iced's defaults. It cost a day of
# "why did every pixel move?" in an app whose layout is measured against a
# reference. The rest of the list is what the defaults already were, so
# nothing else about this crate's build changes.
iced = { git = "https://github.com/playtron-os/iced.git", default-features = false, features = [
    "image",
    "advanced",
    "wgpu",
    "tiny-skia",
    "hinting",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
] }
iced_wgpu = { git = "https://github.com/playtron-os/iced.git" }
gstreamer = "0.23"
gstreamer-allocators = "0.23" # DMA-BUF memory detection
gstreamer-app = "0.23" # appsink
gstreamer-base = "0.23" # basesrc
gstreamer-video = "0.23" # VideoMeta
glib = "0.20" # gobject traits and error type
tracing = "0.1"
libc = "0.2" # dup() for DMA-BUF fd
thiserror = "1"
url = "2" # media uri

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["wasm32-unknown-unknown"]

[dev-dependencies]
pollster = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
